name: Update Smartly feed

on:
  schedule:
    # Runs at minute 0 of every hour (UTC). GitHub may delay scheduled runs
    # by a few minutes under load — this is expected and fine for an hourly feed.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

# Allow the workflow to push the regenerated feed back to the repo
permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MIN_EVENTS: "3"
      SOURCE_URL: "https://drammensteater.no/wp-content/uploads/ambio-marketing/csv/facebook.csv"
      OUTPUT_PATH: "output/facebook_smartly.csv"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        run: python3 scripts/process_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${OUTPUT_PATH}"
          if git diff --staged --quiet; then
            echo "No changes to the feed — nothing to commit."
          else
            git commit -m "chore: update Smartly feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
